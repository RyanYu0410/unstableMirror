<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unstable mirror</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="chrome topbar">
      <h1>unstable mirror</h1>
      <div class="status" id="status">idle</div>
    </header>

    <main class="mirror-stage">
      <section class="mirror-frame" aria-label="mirror">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>

        <div class="mirror-vignette" aria-hidden="true"></div>
        <div class="capture-flash" aria-hidden="true"></div>

        <div class="chrome controls">
          <button id="start-camera">start camera</button>
          <button id="capture" disabled>capture &amp; generate</button>
          <label class="toggle">
            <input type="checkbox" id="loop" />
            <span>loop</span>
          </label>
        </div>

        <div class="chrome meta">
          <div class="progress-track" aria-label="generation progress">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span id="progress">0/0</span>
          <span id="latency"></span>
        </div>
      </section>

      <aside class="result-pool" aria-label="generated image pool">
        <div class="pool-label">pool</div>
        <img id="result" alt="generated portrait" hidden />
        <div class="pool-placeholder" aria-hidden="true">waiting for reflection</div>
      </aside>
    </main>

    <details class="chrome settings">
      <summary>settings</summary>
      <label>
        ComfyUI base URL
        <input id="base-url" type="text" placeholder="http://studio.local:8188" />
      </label>
      <button id="save-settings">save</button>
    </details>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
